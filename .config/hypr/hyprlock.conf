$wall = /home/Gnana/Pictures/wallhaven-nkpl97.jpg
background {
    monitor =
    path = $wall

    blur_passes = 3
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
}
# GENERAL
general {
    no_fade_in = true
    grace = 5
    disable_loading_bar = false
    ignore_empty_input = true
}


# INPUT FIELD
input-field {
    monitor =
    size = 350, 55
    rounding = 5
    outline_thickness = 2
    dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    inner_color = rgba(30, 30, 30, 0.2)
    font_color = rgb(80, 219, 0)
    check_color = rgba(255, 0, 0, 0.4)
    fail_color = rgba(204, 34, 34, 1.0)
    fade_on_empty = false
    font_family = IosevkaSS18
    font_size = 40
    placeholder_text = |Password| $FAIL $ATTEMPTS
    hide_input = false
    position = 0, -120
    dots_rounding = 3
    halign = center
    valign = center

}


# Date
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgb(ffffff)
  font_size = 22
  font_family = IosevkaSS18
  position = 0, 40
  halign = center
  valign = center
}
# Time
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%-I:%M:%S%p")"
  color = rgb(ffffff)
  font_size = 60
  font_family = IosevkaSS18
  position = 0, 120
  halign = center
  valign = center
}
# Uptime
label {
  monitor =
  text = cmd[update:1000] uptime -p
  color = rgb(ffffff)
  font_size = 18
  font_family = IosevkaSS18
  position = 0, 210
  halign = center
  valign = center
}
# Network load (nload-style, see scripts/nload.sh)
label {
  monitor =
  text = cmd[update:1000] /home/Gnana/.config/hypr/scripts/nload.sh
  color = rgb(ffffff)
  font_size = 18
  font_family = IosevkaSS18
  position = 0, 245
  halign = center
  valign = center
}
